# First AMP bring-up image: do not claim the shared Debug UART.
CONFIG_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_UART_INTERRUPT_DRIVEN=n

# RK3588S Zephyr support requires the architected timer and GIC.  Do not
# reconfigure the shared distributor when another OS has already enabled it.
CONFIG_GIC_SAFE_CONFIG=y
# Zephyr ARM64 IRQ entry requires the scheduler switch symbols even though
# this smoke-test application creates no additional threads.
CONFIG_MULTITHREADING=y
